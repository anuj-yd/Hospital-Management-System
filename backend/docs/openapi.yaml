openapi: 3.0.3
info:
  title: Hospital Management System (HMS) REST API
  version: 1.0.0
  description: |
    Production-ready REST API for clinical administration, staff directory, appointments,
    patient management, billing, and strict role-based access control (RBAC).
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      tags:
        - System Health
      summary: Health check & PostgreSQL connectivity status
      responses:
        '200':
          description: System and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database disconnected or degraded.

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@hms.test
                password:
                  type: string
                  example: Admin@12345
      responses:
        '200':
          description: Login successful

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Current Session Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile

  /users:
    get:
      tags:
        - Users (ADMIN only)
      summary: List users (search, role filter, pagination)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, FRONT_DESK, CLINICIAN]
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated users list (without passwordHash)

    post:
      tags:
        - Users (ADMIN only)
      summary: Create new staff user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: nurse.mary@hms.test
                password:
                  type: string
                  example: Password@123
                fullName:
                  type: string
                  example: Mary Poppins
                role:
                  type: string
                  enum: [ADMIN, FRONT_DESK, CLINICIAN]
      responses:
        '201':
          description: User created

  /users/{id}:
    get:
      tags:
        - Users (ADMIN only)
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details (without passwordHash)

    patch:
      tags:
        - Users (ADMIN only)
      summary: Update user (role, isActive, fullName)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Mary Jane
                role:
                  type: string
                  enum: [ADMIN, FRONT_DESK, CLINICIAN]
                isActive:
                  type: boolean
      responses:
        '200':
          description: User updated

  /users/{id}/reset-password:
    post:
      tags:
        - Users (ADMIN only)
      summary: Reset user password
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  example: NewPass@999
      responses:
        '200':
          description: Password reset successfully

  /departments:
    get:
      tags:
        - Departments
      summary: List all departments (all authenticated roles)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments

    post:
      tags:
        - Departments
      summary: Create clinical department (ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Neurology
                description:
                  type: string
                  example: Disorders of the nervous system
      responses:
        '201':
          description: Department created

  /departments/{id}:
    get:
      tags:
        - Departments
      summary: Get department details by ID (all authenticated roles)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department details

    patch:
      tags:
        - Departments
      summary: Update department (ADMIN only; 422 if deactivating with active doctors)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Department updated
        '422':
          description: Cannot deactivate department with active doctors

  /doctors:
    get:
      tags:
        - Doctors
      summary: List doctors (filters: departmentId, search by name/specialization, isActive; pagination)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated doctors list

    post:
      tags:
        - Doctors
      summary: Create doctor profile (ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - departmentId
                - specialization
                - licenseNumber
                - consultationFee
              properties:
                userId:
                  type: string
                  format: uuid
                  description: Optional CLINICIAN user id to link (one-to-one)
                departmentId:
                  type: string
                  format: uuid
                specialization:
                  type: string
                  example: Neurologist
                licenseNumber:
                  type: string
                  example: MED-NEURO-2026
                slotDurationMin:
                  type: integer
                  default: 30
                consultationFee:
                  type: number
                  example: 1500
      responses:
        '201':
          description: Doctor created

  /doctors/{id}:
    get:
      tags:
        - Doctors
      summary: Get doctor by ID (all authenticated roles)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor profile

    patch:
      tags:
        - Doctors
      summary: Update doctor profile (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                departmentId:
                  type: string
                  format: uuid
                specialization:
                  type: string
                licenseNumber:
                  type: string
                slotDurationMin:
                  type: integer
                consultationFee:
                  type: number
                isActive:
                  type: boolean
      responses:
        '200':
          description: Doctor updated

  /doctors/{id}/schedules:
    get:
      tags:
        - Schedules
      summary: Get doctor weekly schedules (all authenticated roles)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Weekly schedules list

    put:
      tags:
        - Schedules
      summary: Replace doctor weekly schedules atomically (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - dayOfWeek
                  - startTime
                  - endTime
                properties:
                  dayOfWeek:
                    type: integer
                    description: 0 (Sun) to 6 (Sat)
                    example: 1
                  startTime:
                    type: string
                    example: "09:00"
                  endTime:
                    type: string
                    example: "13:00"
                  isActive:
                    type: boolean
                    default: true
      responses:
        '200':
          description: Schedules replaced successfully
        '400':
          description: Invalid times or startTime not before endTime
        '422':
          description: Overlapping windows or times not aligned to slot duration

  /doctors/{id}/slots:
    get:
      tags:
        - Appointments
      summary: Generate available slots for a doctor (CLINIC_TZ, max 14 days)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            example: 2026-11-10
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of available slots in UTC

  /appointments:
    get:
      tags:
        - Appointments
      summary: List appointments (CLINICIAN scoped to own appointments)
      security:
        - bearerAuth: []
      parameters:
        - name: doctorId
          in: query
          schema:
            type: string
            format: uuid
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated appointments

    post:
      tags:
        - Appointments
      summary: Book an appointment (FRONT_DESK, ADMIN; with Idempotency)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - doctorId
                - startTime
              properties:
                patientId:
                  type: string
                  format: uuid
                doctorId:
                  type: string
                  format: uuid
                startTime:
                  type: string
                  format: date-time
                  example: "2026-11-10T09:00:00.000Z"
                reason:
                  type: string
      responses:
        '201':
          description: Appointment booked
        '409':
          description: SLOT_TAKEN (database unique index violation)
        '422':
          description: PATIENT_DOUBLE_BOOKED or slot misaligned to schedule

  /appointments/{id}:
    get:
      tags:
        - Appointments
      summary: Get appointment by ID (CLINICIAN scoped)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment details

  /appointments/{id}/reschedule:
    patch:
      tags:
        - Appointments
      summary: Reschedule appointment (FRONT_DESK, ADMIN; max 3 times)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newStartTime
              properties:
                newStartTime:
                  type: string
                  format: date-time
                  example: "2026-11-12T10:00:00.000Z"
                reason:
                  type: string
      responses:
        '200':
          description: Appointment rescheduled
        '409':
          description: SLOT_TAKEN or INVALID_STATE_TRANSITION
        '422':
          description: Limit of 3 reached or PATIENT_DOUBLE_BOOKED

  /appointments/{id}/cancel:
    post:
      tags:
        - Appointments
      summary: Cancel appointment (frees slot)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cancelReason
              properties:
                cancelReason:
                  type: string
                  example: "Patient requested cancellation"
      responses:
        '200':
          description: Appointment cancelled

  /appointments/{id}/check-in:
    post:
      tags:
        - Appointments
      summary: Check in appointment (FRONT_DESK; only on appointment date in CLINIC_TZ)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Checked in
        '422':
          description: Not appointment date

  /appointments/{id}/no-show:
    post:
      tags:
        - Appointments
      summary: Mark appointment as no-show (FRONT_DESK; only after start time passed)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as NO_SHOW
        '422':
          description: Appointment start time not yet passed


  /patients:
    get:
      tags:
        - Patients
      summary: List / Search patients (CLINICIAN scoped)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          schema:
            type: string
            description: Search across name, phone, or MRN
        - name: gender
          in: query
          schema:
            type: string
            enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated patient directory

    post:
      tags:
        - Patients
      summary: Register new patient (FRONT_DESK, ADMIN; auto-generates safe MRN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - dateOfBirth
                - gender
                - phone
              properties:
                firstName:
                  type: string
                  example: Rohan
                lastName:
                  type: string
                  example: Kapoor
                dateOfBirth:
                  type: string
                  format: date
                  example: 1990-05-20
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
                phone:
                  type: string
                  example: "+919876543210"
                email:
                  type: string
                  format: email
                  example: rohan.kapoor@example.com
                address:
                  type: string
                  example: "42 MG Road, Bengaluru"
      responses:
        '201':
          description: Patient created with auto-generated MRN

  /patients/{id}:
    get:
      tags:
        - Patients
      summary: Get patient details by ID (audited; CLINICIAN scoped: 403 if unlinked)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comprehensive patient record
        '403':
          description: Clinician does not have appointment/visit access to this patient

    patch:
      tags:
        - Patients
      summary: Update patient record (FRONT_DESK, ADMIN; audited)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
                emergencyContactName:
                  type: string
                emergencyContactPhone:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Patient updated

    delete:
      tags:
        - Patients
      summary: Soft delete patient (ADMIN only; sets isActive = false; audited)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Patient soft-deleted successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: connected
