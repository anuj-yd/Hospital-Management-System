openapi: 3.0.3
info:
  title: Hospital Management System (HMS) REST API
  version: 1.0.0
  description: |
    Production-ready REST API for clinical administration, appointments, patient management,
    billing, and role-based access control.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      tags:
        - System Health
      summary: Health check & PostgreSQL connectivity status
      description: Returns uptime, API health status, and live database connection state.
      responses:
        '200':
          description: System and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database disconnected or degraded.

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates user credentials and returns JWT access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@hms.test
                password:
                  type: string
                  format: password
                  example: Admin@12345
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Current Session Profile
      description: Returns details of the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user details

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Access Token
      description: Exchanges a valid refresh token for a fresh short-lived access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Fresh access token generated

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Revokes active session and invalidates refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Successfully logged out

  /users:
    get:
      tags:
        - Users
      summary: List users (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of staff users

    post:
      tags:
        - Users
      summary: Create new staff user (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, FRONT_DESK, CLINICIAN]
      responses:
        '201':
          description: User created

  /patients:
    get:
      tags:
        - Patients
      summary: List / Search Patients
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated patient list

    post:
      tags:
        - Patients
      summary: Register New Patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - dateOfBirth
                - phone
              properties:
                firstName:
                  type: string
                  example: Aarav
                lastName:
                  type: string
                  example: Mehta
                dateOfBirth:
                  type: string
                  format: date
                  example: 1988-04-12
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                phone:
                  type: string
                  example: "+919876543210"
                email:
                  type: string
                  format: email
                  example: aarav.mehta@example.com
                bloodGroup:
                  type: string
                  example: O_POSITIVE
      responses:
        '201':
          description: Patient created successfully

  /patients/{id}:
    get:
      tags:
        - Patients
      summary: Get Patient by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient details

  /departments:
    get:
      tags:
        - Departments
      summary: List all clinical departments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department list

    post:
      tags:
        - Departments
      summary: Create clinical department (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Cardiology
                description:
                  type: string
                  example: Heart and cardiovascular health
      responses:
        '201':
          description: Department created

  /doctors:
    get:
      tags:
        - Doctors
      summary: List doctors
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of doctors

    post:
      tags:
        - Doctors
      summary: Onboard doctor profile (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - departmentId
                - specialization
                - licenseNumber
                - consultationFee
              properties:
                userId:
                  type: string
                  format: uuid
                departmentId:
                  type: string
                  format: uuid
                specialization:
                  type: string
                  example: Cardiologist
                licenseNumber:
                  type: string
                  example: MCI-2024-88421
                consultationFee:
                  type: integer
                  description: Fee in paise (e.g. 50000 = ₹500)
                  example: 50000
      responses:
        '201':
          description: Doctor profile created

  /doctors/{id}:
    get:
      tags:
        - Doctors
      summary: Get Doctor profile by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor profile with department and schedule

  /appointments:
    get:
      tags:
        - Appointments
      summary: List appointments
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: doctorId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointments list

    post:
      tags:
        - Appointments
      summary: Book an appointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - doctorId
                - appointmentDate
                - startTime
                - endTime
              properties:
                patientId:
                  type: string
                  format: uuid
                doctorId:
                  type: string
                  format: uuid
                appointmentDate:
                  type: string
                  format: date
                  example: 2026-11-10
                startTime:
                  type: string
                  example: "09:00"
                endTime:
                  type: string
                  example: "09:30"
      responses:
        '201':
          description: Appointment booked

  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Retrieve system audit logs (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: entity
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit entries

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: integer
          example: 45
        timestamp:
          type: string
          example: 2026-11-07T07:40:00.000Z
        database:
          type: string
          example: connected

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                role:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
            accessToken:
              type: string
            refreshToken:
              type: string

