services:
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_password
      POSTGRES_DB: hms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hms_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: hms-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms_test_user
      POSTGRES_PASSWORD: hms_test_password
      POSTGRES_DB: hms_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_test_user -d hms_test_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
